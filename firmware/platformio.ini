; Ripar Wallet firmware - Waveshare ESP32-S3-LCD-2 (ESP32-S3R8: 8 MB octal PSRAM, 16 MB flash)
[platformio]
default_envs = ripar

[env:ripar]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; ---- compile-check env for the device modules (used while modules are written in parallel) ----
[env:chk_device]
extends = env:ripar
build_src_filter = -<*> +<hashes.cpp> +<util.cpp> +<crypto.cpp> +<io.cpp> +<pulse.cpp> +<pulse_algo.cpp> +<qrscan.cpp> +<ui.cpp> +<store.cpp> +<context.cpp> +<fsm.cpp> +<keys.cpp> +<abi.cpp> +<../test/device/check_main.cpp>
