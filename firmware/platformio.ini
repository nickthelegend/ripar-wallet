; Ripar Wallet firmware - Waveshare ESP32-S3-LCD-2 (ESP32-S3R8: 8 MB octal PSRAM, 16 MB flash)
[platformio]
default_envs = ripar

; env:ripar (default)   FOR TESTING: QR + the Bluetooth LE fallback courier + the Wi-Fi test link (RIPAR_BLE=1,
;                       RIPAR_WIFI=1; docs/BLE_LINK.md, docs/WIFI_LINK.md). Wi-Fi is a TEMPORARY TEST FEATURE: it
;                       only runs with a network confirmed on the device AND WI-FI ON chosen in the menu (persisted).
;                       Bluetooth is dead at boot and only turned on from the device menu (review + pulse + SIGN).
;                       RADIO ON / WIFI ON badge while a radio is alive.
; env:ripar-ble         QR + Bluetooth LE fallback only (RIPAR_WIFI=0): src/wifi_link.cpp + src/wifi_proto.cpp not
;                       built, no Wi-Fi / lwIP symbol linked.
; env:ripar-airgap      the radio-free firmware (the air-gapped pitch build): RIPAR_BLE=0, RIPAR_WIFI=0, no ble_* /
;                       wifi_* source built, no Bluetooth / Wi-Fi symbol linked (docs/FIRMWARE.md "Radio check").
[env:ripar]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -DRIPAR_BLE=1
    -DRIPAR_WIFI=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.7

[env:ripar-ble]
extends = env:ripar
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -DRIPAR_BLE=1
    -DRIPAR_WIFI=0
build_src_filter = +<*> -<.git/> -<.svn/> -<wifi_link.cpp> -<wifi_proto.cpp>
lib_ignore = WiFi, WebServer, ESPmDNS

[env:ripar-airgap]
extends = env:ripar
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -DRIPAR_BLE=0
    -DRIPAR_WIFI=0
build_src_filter = +<*> -<.git/> -<.svn/> -<ble_link.cpp> -<ble_proto.cpp> -<wifi_link.cpp> -<wifi_proto.cpp>
lib_ignore = BLE, WiFi, WebServer, ESPmDNS

; ---- compile-check env for the device modules (used while modules are written in parallel) ----
[env:chk_device]
; radio-free hardware bring-up check (display, SIGN key, buzzer, pulse sensor, camera, keys self-test)
extends = env:ripar-airgap
build_src_filter = -<*> +<hashes.cpp> +<util.cpp> +<crypto.cpp> +<io.cpp> +<pulse.cpp> +<pulse_algo.cpp> +<qrscan.cpp> +<ui.cpp> +<store.cpp> +<context.cpp> +<fsm.cpp> +<keys.cpp> +<abi.cpp> +<../test/device/check_main.cpp>
