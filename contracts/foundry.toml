[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# delegation-framework v1.3.0 pins `pragma solidity 0.8.23` and the enforcer inherits its CaveatEnforcer
solc = "0.8.23"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# bytecode independent of comments/paths, so the CREATE2 addresses pinned in the firmware stay stable
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
